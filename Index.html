<!DOCTYPE html>
<html data-cache-menu-id="<?= menuId ?>" data-cache-org="<?= maxDate ?>">
	<head>
		<base target="_top">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.pumpkin.min.css">
		<style>
			.hidden
			{
				display: none;
			}
			#orgSection
			{
				position: relative;
				display: inline-block;
				min-height: 50px;
				min-width: 50px;
			}
			#orgSection.disabled,
			#orgSection.loading
			{
				opacity: 0.5;
				pointer-events: none;
			}
			#orgSection > #orgSpinner
			{
				position: absolute;
				top: calc(50% - 25px);
				left: calc(50% - 25px);
				width: 50px;
				height: 50px;
				background: rgba(255, 255, 255, 0.8);
				display: flex;
				justify-content: center;
				align-items: center;
				z-index: 10;
			}
			#orgSection.loaded > #orgSpinner,
			#orgSection.disabled > #orgSpinner
			{
				display: none;
			}
			.spinner
			{
				width: 50px;
				height: 50px;
				border: 4px solid #ccc;
				border-top: 4px solid #333;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}
			@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
			.article-section
			{
				display: none;
			}
			dd[data-structure-info="Planning"]
			{
				white-space: pre-line;
			}
			tr.qty-exceeded > .col-max-qty,
			tr.qty-exceeded > .col-order-qty
,
			tr.qty-exceeded > .col-order-qty > input
			{
				background-color: #ff000020;
				color: #a00;
			}
			{
				content: " kg";
			}
			td.col-max-qty
			{
				text-align: center;
			}
			td.col-order-qty,
			td.col-total-weight,
			td.col-unit-weight
			{
				text-align: right;
			}
			td.col-unit-weight::after,
			td.col-total-weight::after,
			.as_kg td.col-max-qty::after,
			.as_kg td.col-order-qty::after
			{
				content: " kg";
				vertical-align: middle;
			}
			.col-order-qty > input
			{
				width: 50px;
				direction: rtl;
			}
			.as_colis td.col-max-qty::after,
			.as_colis td.col-order-qty::after
			{
				content: " colis";
				vertical-align: middle;
			}
			.as_kg .col-unit-weight
			{
				display: none;
			}
			table th
			{
				text-align: center;
			}
			#articleSections.filter-for_asso > .for_asso,
			#articleSections.filter-for_es > .for_es
			{
				display: unset;
			}
		</style>
	</head>
	<body>
		<main class="container">
			<div id="debug" style="font-family: monospace; font-size: 12px; background: #eee; padding: 5px; margin-bottom: 10px;"></div>
			<h1>Formulaire de Commande</h1>
			<form id="orderForm" onsubmit="handleFormSubmit(this)">
				<fieldset>
					<label for="email">
						Email
						<input type="email" id="email" name="email" required>
					</label>

					<label for="codeVif">
						Code VIF
						<input type="text" id="codeVif" name="codeVif" inputmode="numeric" pattern="^[1-9]0?13[0-9]{4}" required oninput="checkCodeVif(this.value)">
					</label>
				</fieldset>

				<div id="orgSection" class="disabled">
					<div id="orgSpinner" class="spinner"></div>
					<fieldset>
						<legend>Informations Organisation</legend>
						<dl>
							<dt>Organisation</dt>
							<dd data-structure-info="Nom"></dd>
							<dt>UD</dt>
							<dd data-structure-info="UD"></dd>
							<dt>Planning</dt>
							<dd data-structure-info="Planning"></dd>
						</dl>
					</fieldset>
				</div>
				
				<div id="articleSections"></div>

				<button type="submit">Envoyer</button>
			</form>
		</main>

		<script>
			const perfStart = performance.now();
			const serverPerf = <?!= JSON.stringify(serverPerf) ?>;
			const debug = document.getElementById('debug');
			debug.innerHTML += `<div>Perf: Server computation total=${serverPerf.total}ms (maxDate=${serverPerf.maxDate}ms, menuId=${serverPerf.menuId}ms)</div>`;

			function logPerformance(message)
			{
				const duration = (performance.now() - perfStart).toFixed(2);
				const debug = document.getElementById('debug');
				debug.innerHTML += `<div>Perf: ${message} took ${duration}ms</div>`;
				console.log(`Perf: ${message} took ${duration}ms`);
			}

			function pruneCaches()
			{
				const attrStart = performance.now();
				const html = document.documentElement;
				const currentMenuId = html.dataset.cacheMenuId;
				const currentOrgDate = html.dataset.cacheOrg;
				const attrDuration = (performance.now() - attrStart).toFixed(2);
				const debug = document.getElementById('debug');
				debug.innerHTML += `<div>Perf: Data attribute retrieval took ${attrDuration}ms</div>`;

				const cachedMenuId = localStorage.getItem('menuId');
				const cachedOrgDate = localStorage.getItem('orgMaxDate');

				if (currentMenuId !== cachedMenuId)
				{
					console.log('Menu cache outdated. Clearing.');
					localStorage.removeItem('articlesData');
					localStorage.setItem('menuId', currentMenuId);
				}

				if (currentOrgDate !== cachedOrgDate)
				{
					console.log('Org cache outdated. Clearing.');
					for (let i = localStorage.length - 1; i >= 0; i--)
					{
						const key = localStorage.key(i);
						if (key && key.startsWith('orgData_'))
						{
							localStorage.removeItem(key);
						}
					}
					localStorage.setItem('orgMaxDate', currentOrgDate);
				}
			}

			window.onload = function()
			{
				pruneCaches();

				const emailEl = document.getElementById('email');
				const codeVifEl = document.getElementById('codeVif');

				const savedEmail = localStorage.getItem('email');
				const savedOrg = localStorage.getItem('codeVif');

				if (savedEmail) {
					emailEl.value = savedEmail;
				}
				if (savedOrg) {
					codeVifEl.value = savedOrg;
					checkCodeVif(savedOrg);
				}

				emailEl.addEventListener('input', (e) => {
					localStorage.setItem('email', e.target.value);
				});

				codeVifEl.addEventListener('input', (e) => {
					localStorage.setItem('codeVif', e.target.value);
				});

				const cachedData = localStorage.getItem('articlesData');

				if (cachedData)
				{
					console.log('Loading articles from cache.');
					renderArticles(JSON.parse(cachedData));
					logPerformance('Initial render from cache');
				}
				else
				{
					console.log('Cache miss. Fetching fresh data.');
					const fetchStart = performance.now();
					google.script.run.withSuccessHandler(response =>
					{
						const fetchDuration = (performance.now() - fetchStart).toFixed(2);
						
						const renderStart = performance.now();
						localStorage.setItem('articlesData', JSON.stringify(response.articles));
						renderArticles(response.articles);
						const renderDuration = (performance.now() - renderStart).toFixed(2);
						
						const debug = document.getElementById('debug');
						debug.innerHTML += `<div>Perf: Cache miss - Fetch took ${fetchDuration}ms, Render took ${renderDuration}ms</div>`;
						console.log(`Perf: Cache miss - Fetch took ${fetchDuration}ms, Render took ${renderDuration}ms`);
					}).getCurrentArticles();
				}
			};

			function getCategoryLabel(category)
			{
				if (category === 'Asso')
				{
					return 'Produits réservés aux Associations homologuées';
				}
				if (category === 'ES')
				{
					return 'Produits réservés aux Épiceries Sociales';
				}
				return 'Produits disponibles pour tous';
			}

			function getUnitLabel(unit)
			{
				if (unit === 'kg')
				{
					return 'Produits au KILO';
				}
				if (unit === 'colis')
				{
					return 'Produits en COLIS';
				}
				return '';
			}

			function createProductElement(product)
			{
				const tr = document.createElement('tr');
				
				// Label
				const tdLabel = document.createElement('td');
				tdLabel.textContent = product['Label'];
				tr.appendChild(tdLabel);
				
				// Unit Weight
				const tdWeight = document.createElement('td');
				tdWeight.className = 'col-unit-weight';
				const weight = parseFloat(product['Unit Weight']) || 0;
				tdWeight.dataset.unitWeight = weight;
				tdWeight.textContent = weight.toFixed(1);
				tr.appendChild(tdWeight);

				// Qty Max
				const tdMax = document.createElement('td');
				tdMax.className = 'col-max-qty';
				tdMax.textContent = product['Max Qty'];
				tr.appendChild(tdMax);

				// Qty Input
				const tdInput = document.createElement('td');
				tdInput.className = 'col-order-qty';
				const input = document.createElement('input');
				input.type = 'number';
				input.inputMode = 'numeric';
				input.min = '0';
				input.value = '';
				input.oninput = function() { validateQty(this); };
				input.onfocus = function() { this.select(); };
				tdInput.appendChild(input);
				tr.appendChild(tdInput);

				// Poids total
				const tdTotal = document.createElement('td');
				tdTotal.className = 'col-total-weight';
				tdTotal.textContent = '0';
				tr.appendChild(tdTotal);

				return tr;
			}

			function createUnitSection(unit, filtered, categoryClass)
			{
				const unitSection = document.createElement('section');
				unitSection.className = 'as_' + unit + ' ' + categoryClass;
				unitSection.innerHTML = `<h3>${getUnitLabel(unit)}</h3>`;
				const table = document.createElement('table');
				table.className = 'as_' + unit;
				table.innerHTML = `
					<thead>
						<tr>
							<th>Désignation</th>
							<th class="col-unit-weight">Poids du colis</th>
							<th class="col-max-qty">Qté max</th>
							<th class="col-order-qty">Qté souhaitée</th>
							<th class="col-total-weight">Poids total</th>
						</tr>
					</thead>
					<tbody></tbody>
				`;
				
				const tbody = table.querySelector('tbody');
				filtered.forEach(product =>
				{
					tbody.appendChild(createProductElement(product));
				});
				table.appendChild(tbody);
				unitSection.appendChild(table);
				return unitSection;
			}

			function createCategorySection(category, categoryClass)
			{
				const categorySection = document.createElement('section');
				categorySection.className = 'article-section ' + categoryClass;
				categorySection.innerHTML = `<h2>${getCategoryLabel(category)}</h2>`;
				return categorySection;
			}

			function renderArticles(articles)
			{
				const renderStart = performance.now();
				const container = document.getElementById('articleSections');
				const categories = ['Asso', 'ES', 'Asso|ES'];
				const units = ['colis', 'kg'];
				
				categories.forEach(category =>
				{
					const hasArticles = articles.some(a => a.Category === category);
					if (!hasArticles)
					{
						return;
					}

					const catStart = performance.now();
					const categoryClass = category.toLowerCase().split('|').map(c => 'for_' + c).join(' ');
					const categorySection = createCategorySection(category, categoryClass);
					
					units.forEach(unit =>
					{
						const filtered = articles.filter(a => a.Category === category && a.Unit === unit);
						if (filtered.length === 0)
						{
							return;
						}

						const unitStart = performance.now();
						const unitSection = createUnitSection(unit, filtered, categoryClass);
						unitSection.dataset.perf = (performance.now() - unitStart).toFixed(2);
						categorySection.appendChild(unitSection);
					});
					container.appendChild(categorySection);
					logPerformance(`Category ${category}`);
				});
				logPerformance('Total renderArticles');
				validateAllQtys();
			}

			function validateAllQtys()
			{
				const inputs = document.querySelectorAll('#articleSections input[type="number"]');
				inputs.forEach(input => validateQty(input));
			}

			function validateQty(input)
			{
				const row = input.closest('tr');
				const maxQty = parseFloat(row.cells[2].textContent) || 0;
				const unitWeight = parseFloat(row.cells[1].dataset.unitWeight) || 1;
				const tdTotal = row.querySelector('.col-total-weight');
				const trimmedValue = input.value.trim();
				
				if (trimmedValue === '')
				{
					row.classList.remove('qty-exceeded');
					tdTotal.dataset.totalKg = '0';
					tdTotal.textContent = '';
					return;
				}

				const enteredQty = parseFloat(trimmedValue) || 0;

				// Validate qty exceeded
				if (enteredQty > maxQty)
				{
					row.classList.add('qty-exceeded');
				}
				else
				{
					row.classList.remove('qty-exceeded');
				}

				// Update Total kg
				const totalKg = enteredQty * unitWeight;
				tdTotal.dataset.totalKg = totalKg;
				tdTotal.textContent = totalKg.toFixed(2);
			}


			function checkCodeVif(val)
			{
				const regex = /^[1-9]0?13[0-9]{4}/;
				const section = document.getElementById('orgSection');
				if (!regex.test(val))
				{
					section.className = 'disabled';
					return;
				}

				const cachedData = localStorage.getItem('orgData_' + val);
				if (cachedData)
				{
					console.log('Loading org data from cache for:', val);
					showOrg(JSON.parse(cachedData), val);
				}
				else
				{
					console.log('No cache found for org:', val, '. Fetching fresh data.');
					section.className = 'loading';
					google.script.run.withSuccessHandler(response =>
					{
						localStorage.setItem('orgData_' + val, JSON.stringify(response));
						showOrg(response, val);
					}).lookupOrganization(val);
				}
			}

			function showOrg(data, codeVif)
			{
				const section = document.getElementById('orgSection');
				if (!data)
				{
					console.log('No data received for org:', codeVif);
					section.className = 'disabled';
					return;
				}

				console.log('Applying data to UI:', data);
				for (const key in data)
				{
					const el = section.querySelector(`[data-structure-info="${key}"]`);
					if (el)
					{
						el.textContent = data[key];
					}
				}
				section.className = 'loaded';

				const container = document.getElementById('articleSections');
				const dist = data['Modes de distribution de l\'aide alimentaire'] || '';
				console.log('Determining visibility filter for:', dist);
				if (dist.includes('picerie'))
				{
					container.className = 'filter-for_es';
				}
				else
				{
					container.className = 'filter-for_asso';
				}
			}

			function handleFormSubmit(form)
			{
				event.preventDefault();
				google.script.run.withSuccessHandler(alert).processForm(form);
			}
		</script>
	</body>
</html>
