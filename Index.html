<!DOCTYPE html>
<html data-cache-menu-id="<?= menuId ?>" data-cache-org="<?= maxDate ?>">
	<head>
		<base target="_top">
		<style>
			.hidden
			{
				display: none;
			}
			.disabled
			{
				opacity: 0.5;
				pointer-events: none;
			}
			.article-section
			{
				display: none;
			}
			#articleSections.filter-for_asso > .for_asso,
			#articleSections.filter-for_es > .for_es
			{
				display: unset;
			}
		</style>
	</head>
	<body>
		<h1>Formulaire de Commande</h1>
		<form id="orderForm" onsubmit="handleFormSubmit(this)">
			<label for="email">Email:</label><br>
			<input type="email" id="email" name="email" required><br><br>

			<label for="codeVif">Code VIF:</label><br>
			<input type="text" id="codeVif" name="codeVif" required oninput="checkCodeVif(this.value)"><br><br>

			<div id="orgSection" class="disabled">
				<dl>
					<dt>Organisation</dt>
					<dd data-structure-info="Nom"></dd>
					<dt>UD</dt>
					<dd data-structure-info="UD"></dd>
					<dt>Planning</dt>
					<dd data-structure-info="Planning"></dd>
				</dl>
			</div>
			
			<div id="articleSections"></div>

			<button type="submit">Envoyer</button>
		</form>

		<script>
			const perfStart = performance.now();
			const serverPerf = <?= JSON.stringify(serverPerf) ?>;
			const comment = document.createComment(` Perf: Server computation total=${serverPerf.total}ms (maxDate=${serverPerf.maxDate}ms, menuId=${serverPerf.menuId}ms) `);
			document.body.appendChild(comment);

			function logPerformance(message)
			{
				const duration = (performance.now() - perfStart).toFixed(2);
				const comment = document.createComment(` Perf: ${message} took ${duration}ms `);
				document.body.appendChild(comment);
				console.log(`Perf: ${message} took ${duration}ms`);
			}

			function pruneCaches()
			{
				const attrStart = performance.now();
				const html = document.documentElement;
				const currentMenuId = html.dataset.cacheMenuId;
				const currentOrgDate = html.dataset.cacheOrg;
				const attrDuration = (performance.now() - attrStart).toFixed(2);
				const comment = document.createComment(` Perf: Data attribute retrieval took ${attrDuration}ms `);
				document.body.appendChild(comment);

				const cachedMenuId = localStorage.getItem('menuId');
				const cachedOrgDate = localStorage.getItem('orgMaxDate');

				if (currentMenuId !== cachedMenuId)
				{
					console.log('Menu cache outdated. Clearing.');
					localStorage.removeItem('articlesData');
					localStorage.setItem('menuId', currentMenuId);
				}

				if (currentOrgDate !== cachedOrgDate)
				{
					console.log('Org cache outdated. Clearing.');
					for (let i = localStorage.length - 1; i >= 0; i--)
					{
						const key = localStorage.key(i);
						if (key && key.startsWith('orgData_'))
						{
							localStorage.removeItem(key);
						}
					}
					localStorage.setItem('orgMaxDate', currentOrgDate);
				}
			}

			window.onload = function()
			{
				pruneCaches();

				const emailEl = document.getElementById('email');
				const codeVifEl = document.getElementById('codeVif');

				const savedEmail = localStorage.getItem('email');
				const savedOrg = localStorage.getItem('codeVif');

				if (savedEmail) {
					emailEl.value = savedEmail;
				}
				if (savedOrg) {
					codeVifEl.value = savedOrg;
					checkCodeVif(savedOrg);
				}

				emailEl.addEventListener('input', (e) => {
					localStorage.setItem('email', e.target.value);
				});

				codeVifEl.addEventListener('input', (e) => {
					localStorage.setItem('codeVif', e.target.value);
				});

				const cachedData = localStorage.getItem('articlesData');

				if (cachedData)
				{
					console.log('Loading articles from cache.');
					renderArticles(JSON.parse(cachedData));
					logPerformance('Initial render from cache');
				}
				else
				{
					console.log('Cache miss. Fetching fresh data.');
					google.script.run.withSuccessHandler(response =>
					{
						localStorage.setItem('articlesData', JSON.stringify(response.articles));
						renderArticles(response.articles);
						logPerformance('Initial render from server');
					}).getCurrentArticles();
				}
			};

			function getCategoryLabel(category)
			{
				if (category === 'Asso')
				{
					return 'Produits réservés aux Associations homologuées';
				}
				if (category === 'ES')
				{
					return 'Produits réservés aux Épiceries Sociales';
				}
				return 'Produits disponibles pour tous';
			}

			function getUnitLabel(unit)
			{
				if (unit === 'kg')
				{
					return 'Produits au KILO';
				}
				if (unit === 'colis')
				{
					return 'Produits en COLIS';
				}
				return '';
			}

			function createProductElement(product)
			{
				const tr = document.createElement('tr');
				for (const key in product)
				{
					const td = document.createElement('td');
					td.textContent = product[key];
					tr.appendChild(td);
				}
				return tr;
			}

			function createUnitSection(unit, filtered, categoryClass)
			{
				const unitSection = document.createElement('section');
				unitSection.className = 'as_' + unit + ' ' + categoryClass;
				unitSection.innerHTML = `<h3>${getUnitLabel(unit)}</h3>`;
				const table = document.createElement('table');
				const thead = document.createElement('thead');
				const trHead = document.createElement('tr');
				const keys = Object.keys(filtered[0]);
				keys.forEach(key =>
				{
					const th = document.createElement('th');
					th.textContent = key;
					trHead.appendChild(th);
				});
				thead.appendChild(trHead);
				table.appendChild(thead);
				const tbody = document.createElement('tbody');
				filtered.forEach(product =>
				{
					tbody.appendChild(createProductElement(product));
				});
				table.appendChild(tbody);
				unitSection.appendChild(table);
				return unitSection;
			}

			function createCategorySection(category, categoryClass)
			{
				const categorySection = document.createElement('section');
				categorySection.className = 'article-section ' + categoryClass;
				categorySection.innerHTML = `<h2>${getCategoryLabel(category)}</h2>`;
				return categorySection;
			}

			function renderArticles(articles)
			{
				const container = document.getElementById('articleSections');
				const categories = ['Asso', 'ES', 'Asso|ES'];
				const units = ['colis', 'kg'];
				
				categories.forEach(category =>
				{
					const hasArticles = articles.some(a => a.Category === category);
					if (!hasArticles)
					{
						return;
					}

					const categoryClass = category.toLowerCase().split('|').map(c => 'for_' + c).join(' ');
					const categorySection = createCategorySection(category, categoryClass);
					
					units.forEach(unit =>
					{
						const filtered = articles.filter(a => a.Category === category && a.Unit === unit);
						if (filtered.length === 0)
						{
							return;
						}

						const unitSection = createUnitSection(unit, filtered, categoryClass);
						categorySection.appendChild(unitSection);
					});
					container.appendChild(categorySection);
				});
			}

			function checkCodeVif(val)
			{
				const regex = /^[1-9]0?13[0-9]{4}/;
				if (!regex.test(val))
				{
					document.getElementById('orgSection').classList.add('disabled');
					return;
				}

				const cachedData = localStorage.getItem('orgData_' + val);
				if (cachedData)
				{
					console.log('Loading org data from cache for:', val);
					showOrg(JSON.parse(cachedData), val);
				}
				else
				{
					console.log('No cache found for org:', val, '. Fetching fresh data.');
					google.script.run.withSuccessHandler(response =>
					{
						localStorage.setItem('orgData_' + val, JSON.stringify(response));
						showOrg(response, val);
					}).lookupOrganization(val);
				}
			}

			function showOrg(data, codeVif)
			{
				const section = document.getElementById('orgSection');
				if (!data)
				{
					console.log('No data received for org:', codeVif);
					section.classList.add('disabled');
					return;
				}

				console.log('Applying data to UI:', data);
				for (const key in data)
				{
					const el = section.querySelector(`[data-structure-info="${key}"]`);
					if (el)
					{
						el.textContent = data[key];
					}
				}
				section.classList.remove('disabled');

				const container = document.getElementById('articleSections');
				const dist = data['Modes de distribution de l\'aide alimentaire'] || '';
				console.log('Determining visibility filter for:', dist);
				if (dist.includes('picerie'))
				{
					container.className = 'filter-for_es';
				}
				else
				{
					container.className = 'filter-for_asso';
				}
			}

			function handleFormSubmit(form)
			{
				event.preventDefault();
				google.script.run.withSuccessHandler(alert).processForm(form);
			}
		</script>
	</body>
</html>
